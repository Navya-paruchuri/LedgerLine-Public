<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - LedgerLine</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Poppins',Arial;margin:0;background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
    .card{background:white;padding:28px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.1);width:100%;max-width:380px;text-align:center}
    .logo{font-size:28px;font-weight:700;color:#1e2a5a}
    .logo span{color:#22c55e}
    input{width:100%;padding:12px;margin:7px 0;border:1px solid #e2e8f0;border-radius:12px;font-size:14px;box-sizing:border-box}
    button{width:100%;padding:13px;background:#14b8a6;color:white;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
    a{color:#14b8a6;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💼 Ledger<span>Line</span></div>
    <p style="color:#64748b">Create your free account</p>
    <input type="text" id="name" placeholder="👤 Full Name ex: Navya">
    <input type="email" id="email" placeholder="📧 Email">
    <input type="password" id="password" placeholder="🔒 Password">
    <button onclick="signup()">Create Account</button>
    <p style="font-size:14px">Already have account? <a href="login.html">Login</a></p>
  </div>
  <script src="js/signup.js"></script>
</body>
</html>
