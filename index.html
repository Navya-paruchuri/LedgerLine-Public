<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerLine - Smart Accounting</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{font-family:'Poppins',Arial;margin:0;background:#eef2f7;color:#1e293b}
    .navbar{position:sticky;top:0;z-index:10;background:#1e2a5a;color:white;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
    .logo{font-size:22px;font-weight:700}
    .logo span{color:#22c55e}
    .navbar small{color:#cbd5e1;font-size:12px}
    .logout-btn{background:#ef4444;color:white;border:none;padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer}
    main{max-width:1000px;margin:0 auto;padding:18px}
    .balance-hero{background:white;border-radius:20px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .balance-hero h1{font-size:42px;margin:5px 0}
    .hero-pills{display:flex;gap:10px;margin-top:10px}
    .pill{background:#dcfce7;padding:10px 14px;border-radius:12px;min-width:130px}
    .pill.red{background:#fee2e2}
    .pill span{display:block;font-size:12px;color:#64748b}
    .pill b{font-size:18px}
    .bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px}
    .bar-fill{height:100%;border-radius:999px}
    .income-fill{background:#22c55e}
    .expense-fill{background:#ef4444}
    .chart-wrap{flex:1;min-width:260px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
    .card{background:white;padding:20px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
    .card h2{margin:0 0 14px;font-size:19px}
    input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #e2e8f0;border-radius:12px;font-size:14px;font-family:inherit}
    .row{display:flex;gap:10px}
    .add-btn{width:100%;padding:13px;background:#14b8a6;color:white;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
    .download-btn{width:100%;padding:11px;background:white;border:1px solid #cbd5e1;border-radius:12px;font-weight:600;cursor:pointer;margin-top:8px}
    .list-header{display:flex;justify-content:space-between;align-items:center}
    .clear-btn{background:#fff1f2;color:#e11d48;border:none;padding:7px 12px;border-radius:999px;font-weight:700;cursor:pointer}
    #list{list-style:none;padding:0;margin:10px 0}
    #list li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #f1f5f9}
    #list button{border:none;background:#fee2e2;padding:6px 10px;border-radius:8px;cursor:pointer}
    .footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:16px}
    .pie-box{text-align:center}
    canvas{max-width:180px}
  </style>
</head>
<body>
  <div class="navbar">
    <div>
      <div class="logo">💼 Ledger<span>Line</span></div>
      <small>Smart Accounting for Small Business</small>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-weight:600">Hi, <span id="userName">User</span> 👋</span>
      <button onclick="logout()" class="logout-btn">Logout</button>
    </div>
  </div>
  <main>
    <div class="balance-hero">
      <div style="flex:1;min-width:250px">
        <span>Total Balance</span>
        <h1>₹<span id="balance">0</span></h1>
        <div class="hero-pills">
          <div class="pill"><span>⬆ Income</span><b>₹<span id="totalIncome">0</span></b></div>
          <div class="pill red"><span>⬇ Expense</span><b>₹<span id="totalExpense">0</span></b></div>
        </div>
        <div class="chart-wrap">
          <div class="bar"><div class="bar-fill income-fill" id="incomeBar"></div></div>
          <div class="bar"><div class="bar-fill expense-fill" id="expenseBar"></div></div>
          <p id="chartText"></p>
        </div>
      </div>
      <div class="pie-box">
        <canvas id="pieChart" width="180" height="180"></canvas>
        <p style="font-size:12px;color:#64748b;margin:6px 0 0">🟢 Income &nbsp; 🔴 Expense</p>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h2>✨ Add Transaction</h2>
        <input type="text" id="desc" placeholder="💬 What is it for? ex: Sales, Rent">
        <div class="row">
          <input type="number" id="amount" placeholder="₹ Amount">
          <select id="type">
            <option value="income">🟢 Income</option>
            <option value="expense">🔴 Expense</option>
          </select>
        </div>
        <button class="add-btn" onclick="addTransaction()">+ Add Transaction</button>
        <button class="download-btn" onclick="downloadCSV()">📥 Download Excel Report</button>
      </div>
      <div class="card">
        <div class="list-header">
          <h2>📋 Transactions</h2>
          <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
        <input type="text" id="search" placeholder="🔍 Search... ex: rent" oninput="updateUI()">
        <ul id="list"></ul>
        <p id="emptyHint">No transactions yet. Add your first one above 👆</p>
      </div>
    </div>
    <p class="footer">Made with ❤️ in Amaravati • LedgerLine</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
